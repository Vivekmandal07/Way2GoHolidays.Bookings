  <style>
    body {
      font-family: 'Poppins', sans-serif;
      scroll-behavior: smooth;
    }

    .glass-card {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    /* Refined User-Friendly Search Focus */
    .search-focus {
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .search-focus:focus-within {
      border-color: rgba(59, 130, 246, 0.5);
      box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.15), 0 20px 25px -5px rgba(0, 0, 0, 0.3);
      background: rgba(255, 255, 255, 0.1);
      transform: translateY(-2px);
    }

    .search-focus:hover {
      border-color: rgba(255, 255, 255, 0.3);
    }

    /* Custom Zoom Animation for Clicks */
    @keyframes click-zoom {
      0% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.1);
      }

      100% {
        transform: scale(1);
      }
    }

    .animate-click-zoom {
      animation: click-zoom 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    /* Transitions */
    .zoom-on-click:active {
      transform: scale(1.1);
      transition: transform 0.1s ease-out;
    }

    @keyframes fade-in {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .animate-fade-in {
      animation: fade-in 0.6s ease-out forwards;
    }

    /* Blinking/Pulsing status dot */
    @keyframes soft-blink {

      0%,
      100% {
        opacity: 1;
        transform: scale(1);
      }

      50% {
        opacity: 0.4;
        transform: scale(0.8);
      }
    }

    .animate-soft-blink {
      animation: soft-blink 2s infinite ease-in-out;
    }

    @keyframes wave-out {
      0% {
        box-shadow: 0 0 0 0 rgba(17, 72, 203, 0.6);
        transform: scale(1);
      }

      50% {
        transform: scale(1.02);
      }

      100% {
        box-shadow: 0 0 0 20px rgba(17, 72, 203, 0);
        transform: scale(1);
      }
    }

    .animate-wave-out {
      animation: wave-out 2s infinite cubic-bezier(0.25, 1, 0.5, 1);
    }

    /* Heading Reveal Animation */
    .reveal-heading {
      opacity: 0;
      transform: translateY(30px);
      transition: opacity 0.8s ease-out, transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
      cursor: default;
    }

    .reveal-heading.reveal-active {
      opacity: 1;
      transform: translateY(0);
    }

    /* Redesigned Underline: Expands from middle to left and right slowly */
    .heading-underline {
      width: 100%;
      height: 6px;
      background-color: #2563eb;
      border-radius: 9999px;
      position: absolute;
      bottom: -12px;
      left: 0;
      transform: scaleX(0);
      transform-origin: center;
      /* Expanding from the middle */
      opacity: 0;
      pointer-events: none;
    }

    @keyframes underline-intro {
      0% {
        transform: scaleX(0);
        opacity: 0;
      }

      25% {
        transform: scaleX(1);
        opacity: 1;
      }

      75% {
        transform: scaleX(1);
        opacity: 1;
      }

      100% {
        transform: scaleX(0);
        opacity: 0;
      }
    }

    .reveal-active .heading-underline {
      /* Increased duration to 4 seconds for a slower, premium feel */
      animation: underline-intro 4s cubic-bezier(0.65, 0, 0.35, 1) forwards;
    }
  </style>
